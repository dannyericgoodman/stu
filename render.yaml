# Render blueprint for Stu.
#
# Why a blueprint instead of clicking through the dashboard: the DISK is the part
# that is easy to get wrong and fatal to get wrong. Stu keeps everything in SQLite at
# DATABASE_PATH, and db.js refuses to boot in production without it. Declared here,
# the disk is created and mounted before the first boot, so there is no window where
# the app starts, writes to an ephemeral path, and looks fine until the next deploy
# silently erases 2,234 founders.
#
# The plan matters too. Stu runs ten node-cron jobs inside the web process — the
# 4:30am scout IS the morning list. Render's free instances sleep when idle, and a
# sleeping process runs no crons. Starter is the smallest plan that stays awake.
services:
  - type: web
    name: stu
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter          # must not be `free` — free instances sleep and the crons stop
    region: ohio           # closest Render region to Chicago
    healthCheckPath: /api/health
    autoDeploy: true
    disk:
      name: stu-data
      mountPath: /data     # matches DATABASE_PATH below
      sizeGB: 5            # the live DB is ~30MB; 5GB leaves room for the 14 nightly backups
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_PATH
        value: /data/superior-os.db
      - key: PIPELINE_ENABLED
        value: "true"
      - key: STU_BASE_URL
        value: https://www.stu.vc
      - key: ALLOWED_ORIGINS
        value: https://www.stu.vc,https://stu.vc
      # Secrets are NOT in this file on purpose — it is committed to a public repo.
      # sync:false makes Render prompt for each one when the blueprint is created.
      - key: JWT_SECRET
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: AIRTABLE_API_KEY
        sync: false
      - key: EXA_API_KEY
        sync: false
      - key: ENRICHLAYER_API_KEY
        sync: false
